<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fila de retenção · Laboratório do JUJUBA</title>
<style>
:root {
  color-scheme:light dark;
  --font-size-base:1rem;
  --background:#faf9fa; --foreground:#211b20; --muted-foreground:#60565c;
  --muted:#eeebee; --border:#b4acb1; --viz-series-1:#00796c; --viz-series-2:#ad7400;
  --acao:#64214e; --sobre-acao:#fff;
  font:16px/1.5 Inter,"Segoe UI",system-ui,sans-serif; color:var(--foreground); background:var(--background);
}
@media(prefers-color-scheme:dark) { :root {
  --background:#151315; --foreground:#f6f1f4; --muted-foreground:#c5b9c1;
  --muted:#312b30; --border:#665a63; --viz-series-1:#7dcdb8; --viz-series-2:#ecc460;
  --acao:#efb3da; --sobre-acao:#35152c;
} }
* { box-sizing:border-box; }
body { max-width:68rem; margin:0 auto; padding:clamp(.75rem,3vw,2.5rem); }
h2,h3 { margin:0; font-weight:600; } h3 { font-size:1.12rem; }
.form-label { display:grid; gap:.25rem; align-content:start; }
.btn,.form-select,.form-control { max-width:100%; min-width:0; font:inherit; border:1px solid var(--border); border-radius:.4rem; padding:.4rem .65rem; color:var(--foreground); background:var(--background); }
.btn,.form-select,summary { cursor:pointer; }
.btn-primary { border-color:var(--acao); background:var(--acao); color:var(--sobre-acao); }
.btn:disabled { opacity:.55; cursor:default; }
.viz-row,.viz-controls { display:flex; flex-wrap:wrap; align-items:center; gap:.75rem; }
.text-small { font-size:.85rem; } .text-muted { color:var(--muted-foreground); }
.text-destructive { font-weight:600; } .tabular-nums { font-variant-numeric:tabular-nums; }
i[data-lucide] { display:none; }
</style>
</head>
<body>
<section id="jujuba-linha-do-tempo" lang="pt-BR" aria-label="Linha do tempo da retenção em laboratório">
  <header class="tl-cabecalho">
    <h2 id="fila-titulo"></h2>
    <span class="text-muted"><span id="fila-janela"></span> · Ensaio de <time id="fila-hoje" class="tabular-nums"></time></span>
  </header>

  <figure class="tl-figura" aria-label="Histórico da entidade, do mais antigo à esquerda até hoje à direita">
    <div class="tl-extremos text-small" aria-hidden="true">
      <span class="text-muted">Passado</span>
      <span id="fila-marco-antigo" class="tl-marco text-muted"></span>
      <span id="fila-marco-recente" class="tl-marco text-muted"></span>
      <span>Hoje</span>
    </div>
    <div class="tl-eixo" aria-hidden="true">
      <div class="tl-trilho" id="fila-faixas">
        <i class="tl-faixa" data-estado="apagado"></i><i class="tl-faixa" data-estado="pendente"></i>
        <i class="tl-faixa" data-estado="mantido"></i><i class="tl-faixa" data-estado="vazio"></i>
      </div>
      <i id="fila-corte" class="tl-corte" hidden></i>
      <i class="tl-hoje"></i>
    </div>
    <figcaption id="fila-periodos" class="tl-periodos"></figcaption>
  </figure>

  <div class="tl-rodada">
    <button class="btn btn-primary" type="button" id="fila-avancar">Avançar um dia <i data-lucide="arrow-right" aria-hidden="true"></i></button>
    <output id="fila-saida" aria-live="polite" aria-atomic="true"></output>
  </div>
  <div class="viz-row" id="fila-previa" hidden>
    <span id="fila-vencidos" aria-live="polite"></span>
    <button type="button" class="btn" id="fila-limpar">Simular limpeza desta entidade</button>
  </div>
  <details id="fila-regras">
    <summary class="cursor-interaction">Entidade e prazo</summary>
    <div class="tl-opcoes">
      <div class="viz-controls">
        <label class="form-label">Entidade
          <select class="form-select" id="fila-entidade">
            <option value="0">Ocorrências</option><option value="1">Fretes de leitura</option>
            <option value="2">Coletas</option><option value="3">Performance</option>
          </select>
        </label>
        <label class="form-label">Regra da entidade
          <select class="form-select" id="fila-modo">
            <option value="propria">Prazo próprio</option>
            <option value="herdar">Usar o padrão do banco</option>
            <option value="conservar">Conservar todo o histórico</option>
          </select>
        </label>
      </div>
      <div class="viz-controls">
        <label id="fila-grupo-dias" class="form-label">Prazo da entidade em dias
          <input class="form-control" type="number" min="1" max="2147483647" step="1" id="fila-dias">
        </label>
        <label class="form-label">Prazo padrão do banco em dias
          <input class="form-control" type="number" min="1" max="2147483647" step="1" placeholder="Sem prazo" id="fila-banco">
        </label>
      </div>
      <span class="text-destructive text-small" id="fila-erro" role="alert" hidden></span>
      <details id="fila-atraso">
        <summary class="cursor-interaction">Consultar um dia da fila</summary>
        <div class="tl-opcoes">
          <div class="viz-controls">
            <label class="form-label">Data do evento
              <input class="form-control" type="date" id="fila-evento" min="0001-01-01" max="9999-12-31">
            </label>
          </div>
          <output id="fila-destino" aria-live="polite"></output>
          <span id="fila-saldo" class="text-small text-muted"></span>
        </div>
      </details>
    </div>
  </details>
</section>
<style>
#jujuba-linha-do-tempo { --tl-gap:var(--font-size-base); display:grid; gap:calc(var(--tl-gap)*1.2); color:var(--foreground); }
#jujuba-linha-do-tempo [hidden] { display:none !important; }
#jujuba-linha-do-tempo .tl-cabecalho { display:grid; gap:calc(var(--tl-gap)*.2); }
#jujuba-linha-do-tempo .tl-cabecalho h2 { padding-inline-end:5.8rem; }
#jujuba-linha-do-tempo .tl-figura { margin:0; }
#jujuba-linha-do-tempo .tl-extremos { position:relative; display:flex; justify-content:space-between; align-items:baseline; gap:var(--tl-gap); }
#jujuba-linha-do-tempo .tl-marco { position:absolute; top:0; transform:translateX(-50%); white-space:nowrap; }
#jujuba-linha-do-tempo .tl-marco::after { content:""; position:absolute; left:50%; top:100%; margin-top:calc(var(--tl-gap)*.26); height:calc(var(--tl-gap)*.45); width:1px; background:var(--muted-foreground); }
#jujuba-linha-do-tempo .tl-eixo { position:relative; height:calc(var(--tl-gap)*2.3); display:grid; align-items:center; }
#jujuba-linha-do-tempo .tl-trilho { position:relative; overflow:hidden; height:calc(var(--tl-gap)*.55); border-radius:999px; isolation:isolate; background:var(--muted); }
#jujuba-linha-do-tempo .tl-faixa { position:absolute; inset-block:0; left:0; width:0; }
#jujuba-linha-do-tempo [data-estado="apagado"] { background:repeating-linear-gradient(125deg,transparent 0 3px,var(--muted-foreground) 3px 4.5px),var(--muted); }
#jujuba-linha-do-tempo [data-estado="pendente"] { background:repeating-linear-gradient(90deg,var(--viz-series-2) 0 4px,transparent 4px 7px),var(--muted); }
#jujuba-linha-do-tempo [data-estado="mantido"] { background:var(--viz-series-1); }
#jujuba-linha-do-tempo [data-estado="vazio"] { background:radial-gradient(circle,var(--muted-foreground) 1px,transparent 1.5px) left center/6px 6px repeat-x,var(--muted); }
#jujuba-linha-do-tempo .tl-corte { position:absolute; top:50%; height:calc(var(--tl-gap)*1.4); width:2px; transform:translate(-50%,-50%); background:var(--foreground); }
#jujuba-linha-do-tempo .tl-hoje { position:absolute; inset-inline-end:0; top:50%; transform:translateY(-50%); height:calc(var(--tl-gap)*.86); aspect-ratio:1; border-radius:50%; background:var(--foreground); }
#jujuba-linha-do-tempo .tl-periodos { display:flex; gap:calc(var(--tl-gap)*.7) calc(var(--tl-gap)*1.7); flex-wrap:wrap; }
#jujuba-linha-do-tempo .tl-periodo { display:grid; grid-template-columns:var(--tl-gap) auto; gap:0 calc(var(--tl-gap)*.45); align-items:baseline; }
#jujuba-linha-do-tempo .tl-periodo > i { width:var(--tl-gap); height:calc(var(--tl-gap)*.45); border-radius:999px; align-self:center; }
#jujuba-linha-do-tempo .tl-periodo > span { grid-column:2; }
#jujuba-linha-do-tempo .tl-periodo strong { font-weight:500; }
#jujuba-linha-do-tempo .tl-rodada { display:flex; align-items:center; gap:calc(var(--tl-gap)*.60) var(--tl-gap); flex-wrap:wrap; }
#jujuba-linha-do-tempo .tl-opcoes { display:grid; gap:calc(var(--tl-gap)*.7); margin-top:calc(var(--tl-gap)*.75); }
@media(prefers-reduced-motion:no-preference) {
  #jujuba-linha-do-tempo.tl-mover .tl-faixa { transition:width 220ms ease,left 220ms ease; }
  #jujuba-linha-do-tempo.tl-mover .tl-corte { transition:left 220ms ease; }
}
</style>
<script>
(() => {
  const root = document.getElementById('jujuba-linha-do-tempo');
  const el = name => root.querySelector('#fila-' + name);
  const entities = ['Ocorrências', 'Fretes de leitura', 'Coletas', 'Performance'];
  const oneDay = 86400000;
  const origin = Date.UTC(2026, 7, 24);
  const initialDay = 93;
  const lastDay = (Date.UTC(9999, 11, 31) - origin) / oneDay;
  const maxDays = 2147483647;
  const dateAt = d => new Date(origin + d * oneDay);
  const iso = d => dateAt(d).toISOString().slice(0, 10);
  const dateFmt = opts => new Intl.DateTimeFormat('pt-BR', { ...opts, timeZone:'UTC' });
  const shortMonth = dateFmt({ month:'short' });
  const full = dateFmt({ day:'2-digit', month:'2-digit', year:'numeric' });
  const countFmt = new Intl.NumberFormat('pt-BR');
  const compact = new Intl.NumberFormat('pt-BR', { notation:'compact', maximumFractionDigits:1 });
  function shortDay(d, showYear = false) {
    const date = dateAt(d);
    const month = shortMonth.format(date).replace('.', '');
    return date.getUTCDate() + ' ' + month + (showYear ? ' ' + date.getUTCFullYear() : '');
  }
  const fullDay = d => full.format(dateAt(d));
  const asCount = (n, s, p) => countFmt.format(n) + ' ' + (n === 1 ? s : p);
  const records = n => asCount(n, 'registro', 'registros');
  const days = n => asCount(n, 'dia', 'dias');
  const within = (v, a, b) => Number.isInteger(v) && v >= a && v <= b;
  function initial() {
    return { version:1, day:initialDay, entity:0, bank:null, late:'2026-08-27',
      rules:['propria', 'herdar', 'conservar', 'herdar'].map((mode,i) => ({
        mode, days:i === 0 ? 90 : 30, removed:i === 0 ? 3 : -1, before:-1, round:initialDay
      })) };
  }
  function restore(saved) {
    const raw = saved && saved.privateContent;
    const s = initial();
    if (!raw || raw.version !== 1 || !within(raw.day,initialDay,lastDay) ||
        !within(raw.entity,0,3) || !Array.isArray(raw.rules) || raw.rules.length !== 4 ||
        !(raw.bank === null || within(raw.bank,1,maxDays))) return s;
    const valid = raw.rules.every((r,i) => r &&
      ['propria','herdar','conservar'].includes(r.mode) && within(r.days,1,maxDays) &&
      within(r.round,initialDay,raw.day) && within(r.removed,-1,i === 0 ? r.round : initialDay) &&
      within(r.before,-1,r.removed));
    if (!valid) return s;
    s.day = raw.day; s.entity = raw.entity; s.bank = raw.bank;
    s.rules = raw.rules.map(r => ({mode:r.mode,days:r.days,removed:r.removed,before:r.before,round:r.round}));
    if (raw.late === '' || (typeof raw.late === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(raw.late) && Number.isFinite(Date.parse(raw.late)))) s.late = raw.late;
    return s;
  }
  let state = restore(window.openai && window.openai.widgetState);
  const policy = rule => rule.mode === 'herdar' ? state.bank : rule.mode === 'propria' ? rule.days : null;
  const tail = i => i === 0 ? state.day : initialDay;
  function until(i) {
    const horizon = policy(state.rules[i]);
    return horizon === null ? -1 : Math.min(tail(i), Math.max(-1, state.day - horizon));
  }
  const rowCount = (i, d) => d >= 0 && d <= tail(i) ? 1 + (d + i) % 4 : 0;
  function rows(i, from, to) {
    const lo = Math.max(0, from), hi = Math.min(tail(i), to);
    const size = Math.max(0, hi - lo + 1);
    let n = Math.floor(size / 4) * 10;
    for (let k = 0; k < size % 4; k++) n += rowCount(i, lo + k);
    return n;
  }
  function save() {
    const r = state.rules[state.entity];
    if (window.openai && typeof window.openai.setWidgetState === 'function') {
      const modelContent = { entidade:entities[state.entity], dataDoEnsaio:iso(state.day),
        diasDaRegra:policy(r), diasApagadosNoEnsaio:r.removed + 1, registrosAtivos:rows(state.entity,r.removed + 1,tail(state.entity)) };
      Promise.resolve(window.openai.setWidgetState({ modelContent, privateContent:JSON.parse(JSON.stringify(state)) })).catch(() => {});
    }
  }
  function runCycle(i) {
    const rule = state.rules[i];
    rule.before = rule.removed;
    rule.removed = Math.max(rule.removed, until(i));
    rule.round = state.day;
  }
  const labels = { apagado:'Apagado', pendente:'Aguarda limpeza', mantido:'Guardado', vazio:'Sem registros no ensaio' };
  function status(i,d) {
    if (d < 0 || d > tail(i)) return 'vazio';
    if (d <= state.rules[i].removed) return 'apagado';
    return d <= until(i) ? 'pendente' : 'mantido';
  }
  function dateRange(first, last) {
    const a = dateAt(first), b = dateAt(last);
    const crossYear = a.getUTCFullYear() !== b.getUTCFullYear();
    const showYear = crossYear || b.getUTCFullYear() !== dateAt(state.day).getUTCFullYear();
    if (first === last) return shortDay(first,showYear);
    if (!crossYear && a.getUTCMonth() === b.getUTCMonth()) return a.getUTCDate() + '–' + shortDay(last,showYear);
    return shortDay(first,crossYear) + ' – ' + shortDay(last,showYear);
  }
  function timeline(i, rule) {
    const end = tail(i);
    const due = Math.max(rule.removed, until(i));
    const total = state.day + 1;
    const magnitude = 10 ** Math.floor(Math.log10(total / 3));
    const step = Math.round(total / (3 * magnitude)) * magnitude;
    for (const [id,age] of [['marco-antigo',2 * step],['marco-recente',step]]) {
      const position = 100 * (state.day - age + .5) / total;
      const mark = el(id);
      mark.hidden = position < 20 || position > 82;
      mark.style.left = position + '%';
      mark.textContent = 'Há ' + (age < 1000 ? days(age) : compact.format(age) + ' dias');
    }
    const ranges = [
      ['apagado', 0, rule.removed, 'apagado', 'apagados'],
      ['pendente', rule.removed + 1, due, 'aguarda limpeza', 'aguardam limpeza'],
      ['mantido', due + 1, end, 'guardado', 'guardados'],
      ['vazio', end + 1, state.day, 'sem entrada', 'sem entrada']
    ];
    const periods = [];
    for (const [type, from, to, singular, plural] of ranges) {
      const count = Math.max(0,to - from + 1);
      const band = el('faixas').querySelector('[data-estado="' + type + '"]');
      band.style.left = 100 * from / total + '%';
      band.style.width = 100 * count / total + '%';
      if (!count) continue;
      const group = document.createElement('div');
      group.className = 'tl-periodo'; group.dataset.periodo = type;
      const sample = document.createElement('i');
      sample.dataset.estado = type; sample.setAttribute('aria-hidden','true');
      const label = document.createElement('strong');
      label.textContent = days(count) + ' ' + (count === 1 ? singular : plural);
      const when = document.createElement('span');
      when.className = 'text-small text-muted tabular-nums';
      when.textContent = dateRange(from,to);
      group.append(sample,label,when);
      periods.push(group);
    }
    el('periodos').replaceChildren(...periods);
    const firstKept = due + 1;
    el('corte').hidden = firstKept === 0 || firstKept > end;
    el('corte').style.left = 100 * firstKept / total + '%';
  }
  function direction() {
    const v = el('evento').value;
    let text;
    if (!v) text = 'Em revisão. Falta a data de negócio.';
    else {
      const d = (Date.parse(v + 'T00:00:00Z') - origin) / oneDay;
      const r = state.rules[state.entity];
      const period = policy(r);
      if (!Number.isFinite(d) || d > state.day) text = 'Data futura ou inválida. A chegada ficaria em revisão.';
      else {
        const kind = status(state.entity,d);
        const amount = rowCount(state.entity,d);
        const observed = labels[kind] + (amount ? ' · ' + records(amount) : '');
        const review = kind === 'apagado' || (period !== null && d <= state.day - period);
        text = observed + '. ' + (review ? 'Uma chegada para esse dia ficaria em revisão.' : 'Uma chegada para esse dia entraria na fila.');
      }
    }
    el('destino').textContent = text;
  }
  function render() {
    const i = state.entity, r = state.rules[i], horizon = policy(r);
    el('entidade').value = String(i); el('modo').value = r.mode;
    el('grupo-dias').hidden = r.mode !== 'propria';
    el('dias').value = r.days; el('banco').value = state.bank === null ? '' : state.bank;
    el('erro').hidden = true;
    el('avancar').disabled = state.day === lastDay;
    el('titulo').textContent = 'Retenção de ' + entities[i];
    el('hoje').textContent = shortDay(state.day,true); el('hoje').dateTime = iso(state.day);
    el('janela').textContent = horizon === null ? 'Histórico sem prazo de limpeza'
      : 'Últimos ' + days(horizon) + (r.mode === 'herdar' ? ' · padrão do banco' : '');
    if (horizon === 1) el('janela').textContent = 'Somente o dia atual' + (r.mode === 'herdar' ? ' · padrão do banco' : '');
    const balance = rows(i,r.removed + 1,tail(i));
    el('saldo').textContent = 'Total na fila em ' + fullDay(state.day) + ' · ' + records(balance);
    const removedCount = r.removed - r.before;
    let departed = 'Nenhum dia saiu.';
    if (removedCount > 0) {
      const amount = rows(i,r.before + 1,r.removed);
      const source = (removedCount === 1 ? ' de ' : ' do período ') + dateRange(r.before + 1,r.removed);
      departed = (amount === 1 ? 'Saiu ' : 'Saíram ') + records(amount) + source + '.';
    }
    const newCount = rowCount(i,state.day);
    const arrived = newCount ? (newCount === 1 ? 'Entrou ' : 'Entraram ') + records(newCount) + '.' : 'Nenhum registro entrou.';
    el('saida').textContent = departed + ' ' + arrived;
    const pending = Math.max(0,until(i) - r.removed);
    el('previa').hidden = !pending; el('limpar').disabled = !pending;
    el('vencidos').textContent = pending ? records(rows(i,r.removed + 1,until(i))) + ' na prévia de limpeza.' : '';
    el('evento').value = state.late;
    timeline(i,r); direction();
  }
  function commit() {
    root.classList.add('tl-mover');
    render(); save();
  }
  function readDays() {
    const bank = el('banco'), own = el('dias');
    const bankEmpty = bank.value === '' && !bank.validity.badInput;
    const bankOK = bankEmpty || (within(bank.valueAsNumber,1,maxDays) && bank.validity.valid);
    const ownOK = state.rules[state.entity].mode !== 'propria' || (within(own.valueAsNumber,1,maxDays) && own.validity.valid);
    if (!bankOK || !ownOK) {
      el('erro').hidden = false; el('erro').textContent = 'Informe um número inteiro de 1 a 2.147.483.647 dias.';
      el('avancar').disabled = true; el('limpar').disabled = true;
      return false;
    }
    state.bank = bankEmpty ? null : bank.valueAsNumber;
    if (state.rules[state.entity].mode === 'propria') state.rules[state.entity].days = own.valueAsNumber;
    return true;
  }
  el('entidade').addEventListener('change', () => { state.entity = Number(el('entidade').value); commit(); });
  el('modo').addEventListener('change', () => { state.rules[state.entity].mode = el('modo').value; commit(); });
  for (const id of ['dias','banco']) {
    el(id).addEventListener('input', () => { if (readDays()) render(); });
    el(id).addEventListener('change', () => { if (readDays()) save(); });
  }
  el('avancar').addEventListener('click', () => {
    if (!readDays() || state.day >= lastDay) return;
    state.day++;
    state.rules.forEach((_,i) => runCycle(i));
    commit();
  });
  el('limpar').addEventListener('click', () => { if (readDays()) { runCycle(state.entity); commit(); } });
  el('evento').addEventListener('change', () => { state.late = el('evento').value; direction(); save(); });
  window.addEventListener('openai:set_globals', e => {
    const globals = e.detail && e.detail.globals;
    if (globals && Object.prototype.hasOwnProperty.call(globals,'widgetState')) { state = restore(globals.widgetState); render(); }
  });
  render();
})();
</script>
</body>
</html>
