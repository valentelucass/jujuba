[package]
name = "jujubasql"
version = "0.1.31"
description = "Explorador local de SQL Server"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "native-tls", "winauth", "chrono"] }
zeroize = "1"
futures-util = "0.3"
odbc-api = { version = "30.1", default-features = false, features = ["odbc_version_3_80"] }
sqlparser = { version = "0.63", default-features = false, features = ["std", "visitor"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-native-tls", "mysql", "postgres", "sqlite", "chrono", "bigdecimal", "uuid", "json"] }
chrono = { version = "0.4", default-features = false }
bigdecimal = "0.4"
base64 = "0.22"
mongodb = "3.10.1"
redis = { version = "1.8.2", default-features = false, features = ["tokio-native-tls-comp", "connection-manager"] }
uuid = { version = "1", features = ["serde", "v4"] }
tauri-plugin-dialog = { version = "2", default-features = false }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[profile.release]
strip = true
